<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Página web sobre clorofilas y cambios de color durante la cocción.">
<title>Clorofilas y cambios de color | Química de los alimentos</title>
<style>
:root{
  --green:#2f704b;--green-dark:#19452f;--green-mid:#78a982;
  --green-light:#e9f4e9;--mint:#f4faf4;--white:#fff;
  --ink:#23352a;--muted:#617267;--line:#d9e8da;
  --shadow:0 18px 50px #183d2818;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,Arial,Helvetica,sans-serif;color:var(--ink);background:#f2f8f1}
button{font:inherit}
.topbar{
  min-height:72px;position:sticky;top:0;z-index:10;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px clamp(18px,5vw,76px);background:#fff;
  border-bottom:1px solid var(--line);box-shadow:0 4px 18px #183d2810;
}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;color:var(--green-dark)}
.brand-mark{width:38px;height:38px;border-radius:12px;background:var(--green-light);display:grid;place-items:center;font-size:22px}
.nav-group{display:flex;align-items:center;gap:clamp(14px,2.5vw,28px)}
.site-nav{display:flex;align-items:center;gap:clamp(14px,2.5vw,28px);flex-wrap:wrap}
.site-nav a{color:var(--green-dark);text-decoration:none;font-size:14px;font-weight:750}
.site-nav a:hover{color:var(--green);text-decoration:underline}

/* BOTÓN DE AUDIO SOLO VOLUMEN / SILENCIAR */
.audio-btn{
  width:40px;height:40px;border-radius:50%;
  border:1px solid var(--line);background:var(--green-light);
  color:var(--green-dark);display:grid;place-items:center;
  cursor:pointer;font-size:18px;transition:all .18s ease;
  flex-shrink:0;
}
.audio-btn:hover{background:#dcefdc;border-color:var(--green)}
.audio-btn.muted{background:#f3f5f3;color:#7b8a80}

.deck{display:block;width:min(1160px,92vw);margin:0 auto;padding:34px 0 70px}
.slide{
  display:block;width:100%;height:auto;min-height:0;margin:0 0 28px;
  border-radius:22px;overflow:hidden;background:#fff;
  border:1px solid #e3eee3;box-shadow:var(--shadow);scroll-margin-top:100px;
}
.slide-inner{padding:clamp(28px,5vw,68px);overflow:visible}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2.1px;color:var(--green);font-weight:800;margin-bottom:12px}
h1,h2,h3,p{margin-top:0}
h1{font-size:clamp(38px,5.4vw,68px);line-height:1.04;letter-spacing:-2px;color:#fff;margin-bottom:20px}
h2{font-size:clamp(28px,3.5vw,43px);line-height:1.12;letter-spacing:-1px;color:var(--green-dark);margin-bottom:15px}
h3{font-size:19px;color:var(--green-dark);margin-bottom:8px}
p{font-size:clamp(15px,1.35vw,18px);line-height:1.65;color:#526458;margin-bottom:12px}
.lead{font-size:clamp(17px,1.7vw,21px);line-height:1.55;max-width:760px}
ul{padding-left:21px;margin:8px 0}
li{font-size:clamp(15px,1.25vw,17px);line-height:1.55;margin:8px 0;color:#405448}
strong{color:var(--green-dark)}
.hero{
  min-height:540px;
  display:flex;align-items:center;
  background:linear-gradient(90deg,#123c2de8 0%,#1d5138b8 58%,#1d513840 100%),url('https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=1800&q=88') center/cover;
  color:white;
}
.hero .slide-inner{max-width:840px}
.hero .eyebrow{color:#d8f0d9}
.hero p{color:#eff8ef}
.hero-pill{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border:1px solid #ffffff70;border-radius:99px;color:#f1fff1;background:#ffffff17;font-size:12px;font-weight:800;letter-spacing:1.2px;margin-bottom:24px}
.hero-meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.hero-badge{padding:8px 14px;border-radius:10px;background:#ffffff1c;border:1px solid #ffffff45;color:#f2fbf2;font-size:12px;font-weight:750;letter-spacing:.4px}
.hero-foot{margin-top:18px;color:#e3f2e3;font-size:13px;letter-spacing:.5px}

/* FRANJA DE INTEGRANTES DEBAJO DE LA PORTADA */
.members-strip{
  margin:-14px 0 28px;
  padding:20px clamp(22px,4vw,42px);
  background:#fff;border:1px solid #e3eee3;border-radius:20px;
  box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;
}
.members-label{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--green);font-weight:800;margin-bottom:4px}
.members-names{display:flex;flex-wrap:wrap;gap:12px}
.member-chip{
  padding:9px 16px;border-radius:99px;background:var(--mint);
  border:1px solid var(--line);color:var(--green-dark);
  font-size:14px;font-weight:750;
}

.split{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(22px,4vw,52px);align-items:center}
.photo{width:100%;height:100%;min-height:270px;max-height:420px;object-fit:cover;border-radius:19px;box-shadow:0 12px 28px #183d281c}
.photo-frame{background:var(--green-light);padding:10px;border-radius:22px}
.caption{font-size:12px;color:#718175;margin-top:9px;text-align:center}
.tag{display:inline-block;padding:6px 11px;border-radius:30px;background:var(--green-light);color:var(--green-dark);font-size:11px;font-weight:800;letter-spacing:.7px;margin:4px 5px 4px 0}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;margin-top:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}
.info-card{background:var(--mint);border:1px solid var(--line);border-radius:16px;padding:19px}
.info-card .icon{font-size:25px;margin-bottom:9px}
.info-card p{font-size:14px;margin:0}
.info-card h3{font-size:17px}
.callout{background:var(--green-light);border-left:5px solid var(--green);padding:17px 21px;border-radius:0 13px 13px 0;margin-top:18px}
.callout p{margin:0;color:#294b34;font-weight:650}
.dark{background:linear-gradient(145deg,#19452f,#2f704b);color:white}
.dark h2,.dark h3{color:white}
.dark p,.dark li{color:#edf7ed}
.dark .eyebrow{color:#cce9cf}
.dark .info-card{background:#ffffff12;border-color:#ffffff30}
.dark .info-card h3{color:#e5f5e6}
.dark .info-card p{color:#eaf4ea}

/* ESQUEMA DE REACCIÓN QUÍMICA MEJORADO */
.reaction-board{background:var(--mint);border:1px solid var(--line);border-radius:20px;padding:24px;margin:20px 0}
.reaction{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:stretch}
.molecule{padding:22px 18px;border-radius:18px;text-align:center;background:#e4f4e5;border:2px solid #9cc8a1;display:flex;flex-direction:column;justify-content:space-between}
.molecule-badge{display:inline-block;margin:0 auto 10px;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:.6px;background:#286440;color:#fff}
.molecule h3{font-size:clamp(18px,2.1vw,24px);margin-bottom:6px;color:#1d4e31}
.porphyrin-ring{
  width:118px;height:118px;margin:10px auto;border-radius:22px;
  border:3px dashed #2f704b;background:#fff;
  display:grid;grid-template-rows:1fr auto 1fr;align-items:center;justify-items:center;
  padding:6px;box-shadow:0 6px 16px #183d2812;
}
.ring-row{display:flex;justify-content:space-between;width:82%;font-weight:800;font-size:13px;color:#286440}
.ring-core{font-size:21px;font-weight:900;color:#1d4e31;background:#d9f0db;padding:4px 10px;border-radius:10px}
.molecule small{font-size:13px;color:#395541;font-weight:600;display:block;margin-top:8px}
.molecule.pheo{background:#f3ede0;border-color:#cbb894}
.molecule.pheo .molecule-badge{background:#79613a}
.molecule.pheo h3{color:#6a522d}
.molecule.pheo .porphyrin-ring{border-color:#8a6f43}
.molecule.pheo .ring-row{color:#79613a}
.molecule.pheo .ring-core{color:#6a522d;background:#ebe1cc}
.molecule.pheo small{color:#655336}
.arrow-box{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px}
.reagent-pill{background:#fff;border:1px solid #b8d3ba;border-radius:12px;padding:10px 12px;text-align:center;font-size:12px;font-weight:700;color:var(--green-dark);line-height:1.45;box-shadow:0 4px 12px #183d280d}
.arrow-symbol{color:var(--green);font-size:34px;font-weight:900;line-height:1.1;margin:6px 0}
.byproduct-pill{background:#eaf4ea;border-radius:99px;padding:5px 11px;font-size:11px;font-weight:800;color:#286440}
.formula-bar{margin-top:18px;display:grid;grid-template-columns:1.2fr .8fr;gap:12px}
.formula{text-align:center;background:#fff;border:1.5px solid #a9c7aa;border-radius:13px;padding:14px;font-weight:800;color:var(--green-dark);font-size:clamp(14px,1.5vw,18px);display:flex;align-items:center;justify-content:center}
.secondary-pathway{background:#f7f3eb;border:1px dashed #c8b693;border-radius:13px;padding:12px 14px;font-size:13px;color:#665335;line-height:1.45}

table{border-collapse:collapse;width:100%;font-size:14px;background:white;border-radius:14px;overflow:hidden;box-shadow:0 5px 18px #183d2810}
th{background:var(--green);color:white;text-align:left;padding:14px}
td{padding:13px 14px;border-bottom:1px solid #e5eee5;line-height:1.45}
tr:nth-child(even) td{background:#f3f8f2}
.table-wrap{overflow:auto;margin-top:14px}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.gallery img{width:100%;height:175px;object-fit:cover;border-radius:14px}

/* PREGUNTAS DE REPASO */
.quiz-grid{display:grid;gap:16px;margin-top:18px}
.quiz-card{background:var(--mint);border:1px solid var(--line);border-radius:16px;padding:20px}
.quiz-q{font-weight:800;color:var(--green-dark);font-size:16px;margin-bottom:12px
