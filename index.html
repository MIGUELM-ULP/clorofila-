<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Página web sobre clorofilas y cambios de color durante la cocción.">
<title>Clorofilas y cambios de color | Fundamentos de ciencia y tecnología</title>
<style>
:root{
  --green:#2f704b;--green-dark:#19452f;--green-mid:#78a982;
  --green-light:#e9f4e9;--mint:#f4faf4;--white:#fff;
  --ink:#23352a;--muted:#617267;--line:#d9e8da;
  --shadow:0 18px 50px #183d2818;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,Arial,Helvetica,sans-serif;color:var(--ink);background:#f2f8f1}
button{font:inherit}
.topbar{
  min-height:72px;position:sticky;top:0;z-index:10;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px clamp(18px,5vw,76px);background:#fff;
  border-bottom:1px solid var(--line);box-shadow:0 4px 18px #183d2810;
}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;color:var(--green-dark)}
.brand-mark{width:38px;height:38px;border-radius:12px;background:var(--green-light);display:grid;place-items:center;font-size:22px}
.nav-group{display:flex;align-items:center;gap:clamp(14px,2.5vw,28px)}
.site-nav{display:flex;align-items:center;gap:clamp(14px,2.5vw,28px);flex-wrap:wrap}
.site-nav a{color:var(--green-dark);text-decoration:none;font-size:14px;font-weight:750}
.site-nav a:hover{color:var(--green);text-decoration:underline}

/* BOTÓN DE AUDIO SOLO VOLUMEN / SILENCIAR */
.audio-btn{
  width:40px;height:40px;border-radius:50%;
  border:1px solid var(--line);background:var(--green-light);
  color:var(--green-dark);display:grid;place-items:center;
  cursor:pointer;font-size:18px;transition:all .18s ease;
  flex-shrink:0;
}
.audio-btn:hover{background:#dcefdc;border-color:var(--green)}
.audio-btn.muted{background:#f3f5f3;color:#7b8a80}

.deck{display:block;width:min(1160px,92vw);margin:0 auto;padding:34px 0 70px}
.slide{
  display:block;width:100%;height:auto;min-height:0;margin:0 0 28px;
  border-radius:22px;overflow:hidden;background:#fff;
  border:1px solid #e3eee3;box-shadow:var(--shadow);scroll-margin-top:100px;
}
.slide-inner{padding:clamp(28px,5vw,68px);overflow:visible}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2.1px;color:var(--green);font-weight:800;margin-bottom:12px}
h1,h2,h3,p{margin-top:0}
h1{font-size:clamp(38px,5.4vw,68px);line-height:1.04;letter-spacing:-2px;color:#fff;margin-bottom:20px}
h2{font-size:clamp(28px,3.5vw,43px);line-height:1.12;letter-spacing:-1px;color:var(--green-dark);margin-bottom:15px}
h3{font-size:19px;color:var(--green-dark);margin-bottom:8px}
p{font-size:clamp(15px,1.35vw,18px);line-height:1.65;color:#526458;margin-bottom:12px}
.lead{font-size:clamp(17px,1.7vw,21px);line-height:1.55;max-width:760px}
ul{padding-left:21px;margin:8px 0}
li{font-size:clamp(15px,1.25vw,17px);line-height:1.55;margin:8px 0;color:#405448}
strong{color:var(--green-dark)}
.hero{
  min-height:540px;
  display:flex;align-items:center;
  background:linear-gradient(90deg,#123c2de8 0%,#1d5138b8 58%,#1d513840 100%),url('https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=1800&q=88') center/cover;
  color:white;
}
.hero .slide-inner{max-width:840px}
.hero .eyebrow{color:#d8f0d9}
.hero p{color:#eff8ef}
.hero-pill{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border:1px solid #ffffff70;border-radius:99px;color:#f1fff1;background:#ffffff17;font-size:12px;font-weight:800;letter-spacing:1.2px;margin-bottom:24px}
.hero-meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.hero-badge{padding:8px 14px;border-radius:10px;background:#ffffff1c;border:1px solid #ffffff45;color:#f2fbf2;font-size:12px;font-weight:750;letter-spacing:.4px}
.hero-foot{margin-top:18px;color:#e3f2e3;font-size:13px;letter-spacing:.5px}

/* FRANJA DE INTEGRANTES Y ASIGNATURA DEBAJO DE LA PORTADA */
.members-strip{
  margin:-14px 0 28px;
  padding:20px clamp(22px,4vw,42px);
  background:#fff;border:1px solid #e3eee3;border-radius:20px;
  box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:20px;
}
.members-label{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--green);font-weight:800;margin-bottom:6px}
.members-names{display:flex;flex-wrap:wrap;gap:12px}
.member-chip{
  padding:9px 16px;border-radius:99px;background:var(--mint);
  border:1px solid var(--line);color:var(--green-dark);
  font-size:14px;font-weight:750;
}
.subject-chip{
  padding:9px 16px;border-radius:99px;background:var(--green-light);
  border:1px solid #c3dec5;color:var(--green-dark);
  font-size:14px;font-weight:800;display:inline-block;
}

.split{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(22px,4vw,52px);align-items:center}
.photo{width:100%;height:100%;min-height:270px;max-height:420px;object-fit:cover;border-radius:19px;box-shadow:0 12px 28px #183d281c}
.photo-frame{background:var(--green-light);padding:10px;border-radius:22px}
.caption{font-size:12px;color:#718175;margin-top:9px;text-align:center}
.tag{display:inline-block;padding:6px 11px;border-radius:30px;background:var(--green-light);color:var(--green-dark);font-size:11px;font-weight:800;letter-spacing:.7px;margin:4px 5px 4px 0}
